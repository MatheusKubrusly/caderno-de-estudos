to (ou o relatório)</text></g><g class="entity" data-qualified-name="Atendida.Recusada" id="ent0005" data-source-line="8"><rect x="354.51" y="470.281" width="228.98" height="61.906" fill="#E8F5E9" style="stroke:#2E7D32;stroke-width:0.5;" rx="4" ry="4"/><line x1="354.51" y1="494.25" x2="583.49" y2="494.25" style="stroke:#2E7D32;stroke-width:0.5;"/><text x="439.75" y="486.42" fill="#000" font-size="12" textLength="58.5" font-family="'DejaVu Sans'">Recusada</text><text x="359.51" y="510.388" fill="#000" font-size="12" textLength="208.98" font-family="'DejaVu Sans'">resultado recusado, com o motivo,</text><text x="359.51" y="524.357" fill="#000" font-size="12" textLength="134.707" font-family="'DejaVu Sans'">sem escrita nos dados</text></g><g class="entity" data-qualified-name="Pendente" id="ent0001" data-source-line="4"><rect x="343.41" y="151.461" width="171.172" height="61.906" fill="#E8F5E9" style="stroke:#2E7D32;stroke-width:0.5;" rx="4" ry="4"/><line x1="343.41" y1="175.43" x2="514.582" y2="175.43" style="stroke:#2E7D32;stroke-width:0.5;"/><text x="400.537" y="167.6" fill="#000" font-size="12" textLength="56.918" font-family="'DejaVu Sans'">Pendente</text><text x="348.41" y="191.568" fill="#000" font-size="12" textLength="151.172" font-family="'DejaVu Sans'">guardada no Blackboard,</text><text x="348.41" y="205.537" fill="#000" font-size="12" textLength="143.783" font-family="'DejaVu Sans'">à espera do controlador</text></g><g class="entity" data-qualified-name="Avaliacao" id="ent0002" data-source-line="5"><rect x="314.52" y="287.371" width="228.969" height="61.906" fill="#E8F5E9" style="stroke:#2E7D32;stroke-width:0.5;" rx="4" ry="4"/><line x1="314.52" y1="311.34" x2="543.489" y2="311.34" style="stroke:#2E7D32;stroke-width:0.5;"/><text x="388.9" y="303.51" fill="#000" font-size="12" textLength="80.209" font-family="'DejaVu Sans'">Em avaliação</text><text x="319.52" y="327.478" fill="#000" font-size="12" textLength="182.801" font-family="'DejaVu Sans'">o controlador pergunta a cada</text><text x="319.52" y="341.447" fill="#000" font-size="12" textLength="208.969" font-family="'DejaVu Sans'">especialista, na ordem: condition()</text></g><g class="entity" data-qualified-name="Consumida" id="ent0006" data-source-line="10"><rect x="279.25" y="624.181" width="207.494" height="61.906" fill="#E8F5E9" style="stroke:#2E7D32;stroke-width:0.5;" rx="4" ry="4"/><line x1="279.25" y1="648.15" x2="486.744" y2="648.15" style="stroke:#2E7D32;stroke-width:0.5;"/><text x="349.408" y="640.32" fill="#000" font-size="12" textLength="67.178" font-family="'DejaVu Sans'">Consumida</text><text x="284.25" y="664.288" fill="#000" font-size="12" textLength="187.494" font-family="'DejaVu Sans'">o lugar de requisição pendente</text><text x="284.25" y="678.257" fill="#000" font-size="12" textLength="152.18" font-family="'DejaVu Sans'">fica vazio para a próxima</text></g><g class="start_entity" data-qualified-name=".start." id="ent0007" data-source-line="12"><ellipse cx="429" cy="54.461" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0015" data-source-line="19"><ellipse cx="383" cy="771.091" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="383" cy="771.091" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="22"><path d="M522.12,640.171 L522.12,670.108 A4,4 0 0 0 526.12,674.108 L963.878,674.108 A4,4 0 0 0 967.878,670.108 L967.878,646.171 L957.878,636.171 L526.12,636.171 A4,4 0 0 0 522.12,640.171" style="stroke:#BDBDBD;stroke-width:0.5;" fill="#FFFDE7"/><path d="M957.878,636.171 L957.878,644.171 A2,2 0 0 0 959.878,646.171 L967.878,646.171 L957.878,636.171" style="stroke:#BDBDBD;stroke-width:1;" fill="#FFFDE7"/><text x="528.12" y="652.31" fill="#000" font-size="12" textLength="424.758" font-family="'DejaVu Sans'">Nos dois casos, o resultado (ou o relatório) é publicado no Blackboard,</text><text x="528.12" y="666.278" fill="#000" font-size="12" textLength="380.484" font-family="'DejaVu Sans'">e os observers (janela, CLI e registro de eventos) são avisados.</text></g><!--link *start* to Pendente--><g class="link" data-entity-1="ent0007" data-entity-2="ent0001" id="lnk8" data-source-line="12" data-link-type="dependency"><path d="M429,64.931 C429,83.011 429,118.151 429,146.221" style="stroke:#37474F;stroke-width:1;" fill="none" id="*start*-to-Pendente"/><polygon points="429,151.221,433,142.221,429,146.221,425,142.221,429,151.221" fill="#37474F" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="437.501" y="105.671" fill="#000" font-size="11" textLength="97.668" font-family="'DejaVu Sans'">a fachada publica</text><text x="430" y="118.476" fill="#000" font-size="11" textLength="112.669" font-family="'DejaVu Sans'">(publicarRequisicao)</text></g><!--link Pendente to Avaliacao--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk9" data-source-line="13" data-link-type="dependency"><path d="M429,213.801 C429,235.721 429,260.171 429,282.061" style="stroke:#37474F;stroke-width:1;" fill="none" id="Pendente-to-Avaliacao"/><polygon points="429,287.061,433,278.061,429,282.061,425,278.061,429,287.061" fill="#37474F" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="430" y="254.581" fill="#000" font-size="11" textLength="144.66" font-family="'DejaVu Sans'">o controlador inicia o ciclo</text></g><!--link Avaliacao to Aceita--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk10" data-source-line="14" data-link-type="dependency"><path d="M314.11,328.801 C244.4,337.201 164.79,352.451 143,379.281 C121.98,405.161 135.096,439.205 151.036,465.745" style="stroke:#37474F;stroke-width:1;" fill="none" id="Avaliacao-to-Aceita"/><polygon points="153.61,470.031,152.405,460.256,151.036,465.745,145.547,464.375,153.61,470.031" fill="#3