</text><text x="317.281" y="657.227" fill="#000" font-size="12" textLength="95.221" font-family="'DejaVu Sans'">3. horário antes</text><text x="317.281" y="671.195" fill="#000" font-size="12" textLength="56.783" font-family="'DejaVu Sans'">do último</text><text x="317.281" y="685.164" fill="#000" font-size="12" textLength="96.375" font-family="'DejaVu Sans'">evento da placa</text><text x="317.281" y="699.133" fill="#000" font-size="12" textLength="66.416" font-family="'DejaVu Sans'">4. Subsolo:</text><text x="317.281" y="713.102" fill="#000" font-size="12" textLength="87.387" font-family="'DejaVu Sans'">altura ausente</text><text x="317.281" y="727.07" fill="#000" font-size="12" textLength="74.854" font-family="'DejaVu Sans'">ou > 2,10 m</text><rect x="443.656" y="552.275" width="122.639" height="75.875" fill="#E3F2FD" style="stroke:#1565C0;stroke-width:0.5;" rx="4" ry="4"/><text x="453.656" y="573.414" fill="#000" font-size="12" textLength="102.639" font-family="'DejaVu Sans'">registrarEntrada:</text><text x="453.656" y="587.383" fill="#000" font-size="12" textLength="90.973" font-family="'DejaVu Sans'">estadia aberta,</text><text x="453.656" y="601.352" fill="#000" font-size="12" textLength="42.697" font-family="'DejaVu Sans'">veículo</text><text x="453.656" y="615.32" fill="#000" font-size="12" textLength="62.32" font-family="'DejaVu Sans'">circulando</text><polygon points="435.222,749.9,447.222,761.9,435.222,773.9,423.222,761.9,435.222,749.9" fill="#FFF8E1" style="stroke:#F9A825;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="301.281" y1="54.791" x2="301.281" y2="911.775" style="stroke:#90A4AE;stroke-width:1.5;"/><rect x="576.295" y="663.15" width="100.256" height="61.906" fill="#E3F2FD" style="stroke:#1565C0;stroke-width:0.5;" rx="4" ry="4"/><text x="586.295" y="684.289" fill="#000" font-size="12" textLength="80.256" font-family="'DejaVu Sans'">Grava a linha</text><text x="586.295" y="698.258" fill="#000" font-size="12" textLength="48.7