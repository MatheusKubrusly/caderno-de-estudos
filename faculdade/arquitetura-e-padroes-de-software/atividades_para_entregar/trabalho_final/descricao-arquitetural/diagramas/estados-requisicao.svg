<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:985px;height:803px;background:#FFFFFF;" width="985px" height="803px" viewBox="0 0 985 803" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="312.812" y="23.923" fill="#000" font-size="15" textLength="353.254" font-weight="700" font-family="'DejaVu Sans'">Estados de uma requisição no Blackboard</text></g><!--cluster Atendida--><g class="cluster" data-qualified-name="Atendida" id="ent0003" data-source-line="6"><path d="M11,435.281 L623,435.281 A4,4 0 0 1 627,439.281 L627,454.25 L7,454.25 L7,439.281 A4,4 0 0 1 11,435.281" fill="#E8F5E9"/><path d="M7,454.25 L627,454.25 L627,557.181 A4,4 0 0 1 623,561.181 L11,561.181 A4,4 0 0 1 7,557.181 L7,454.25" fill="#E8F5E9"/><rect x="7" y="435.281" width="620" height="125.9" fill="none" style="stroke:#2E7D32;stroke-width:0.5;" rx="4" ry="4"/><line x1="7" y1="454.25" x2="627" y2="454.25" style="stroke:#2E7D32;stroke-width:0.5;"/><text x="290.088" y="450.42" fill="#000" font-size="12" textLength="53.824" font-family="'DejaVu Sans'">Atendida</text></g><g class="entity" data-qualified-name="Atendida.Aceita" id="ent0004" data-source-line="7"><rect x="30.98" y="475.281" width="288.031" height="61.906" fill="#E8F5E9" style="stroke:#2E7D32;stroke-width:0.5;" rx="4" ry="4"/><line x1="30.98" y1="499.25" x2="319.011" y2="499.25" style="stroke:#2E7D32;stroke-width:0.5;"/><text x="156.205" y="491.42" fill="#000" font-size="12" textLength="37.582" font-family="'DejaVu Sans'">Aceita</text><text x="35.98" y="515.388" fill="#000" font-size="12" textLength="230.414" font-family="'DejaVu Sans'">o especialista escreveu no Blackboard</text><text x="35.98" y="529.357" fill="#000" font-size="12" textLength="268.031" font-family="'DejaVu Sans'">e publicou o resultado aceito (ou o relatório)</text></g><g class="entity" data-qualified-name="Atendida.Recusada" id="ent0005" data-source-line="8"><rect x="354.51" y="475.281" width="228.98" height="61.906" fill="#E8F5E9" style="stroke:#2E7D32;stroke-width:0.5;" rx="4" ry="4"/><line x1="354.51" y1="499.25" x2="583.49" y2="499.25" style="stroke:#2E7D32;stroke-width:0.5;"/><text x="439.75" y="491.42" fill="#000" font-size="12" textLength="58.5" font-family="'DejaVu Sans'">Recusada</text><text x="359.51" y="515.388" fill="#000" font-size="12" textLength="208.98" font-family="'DejaVu Sans'">resultado recusado, com o motivo,</text><text x="359.51" y="529.357" fill="#000" font-size="12" textLength="134.707" font-family="'DejaVu Sans'">sem escrita nos dados</text></g><g class="entity" data-qualified-name="Pendente" id="ent0001" data-source-line="4"><rect x="351.41" y="153.461" width="171.172" height="61.906" fill="#E8F5E9" style="stroke:#2E7D32;stroke-width:0.5;" rx="4" ry="4"/><line x1="351.41" y1="177.43" x2="522.582" y2="177.43" style="stroke:#2E7D32;stroke-width:0.5;"/><text x="408.537" y="169.6" fill="#000" font-size="12" textLength="56.918" font-family="'DejaVu Sans'">Pendente</text><text x="356.41" y="193.568" fill="#000" font-size="12" textLength="151.172" font-family="'DejaVu Sans'">guardada no Blackboard,</text><text x="356.41" y="207.537" fill="#000" font-size="12" textLength="143.783" font-family="'DejaVu Sans'">à espera do controlador</text></g><g class="entity" data-qualified-name="Avaliacao" id="ent0002" data-source-line="5"><rect x="322.52" y="290.371" width="228.969" height="61.906" fill="#E8F5E9" style="stroke:#2E7D32;stroke-width:0.5;" rx="4" ry="4"/><line x1="322.52" y1="314.34" x2="551.489" y2="314.34" style="stroke:#2E7D32;stroke-width:0.5;"/><text x="396.9" y="306.51" fill="#000" font-size="12" textLength="80.209" font-family="'DejaVu Sans'">Em avaliação</text><text x="327.52" y="330.478" fill="#000" font-size="12" textLength="182.801" font-family="'DejaVu Sans'">o controlador pergunta a cada</text><text x="327.52" y="344.447" fill="#000" font-size="12" textLength="208.969" font-family="'DejaVu Sans'">especialista, na ordem: condition()</text></g><g class="entity" data-qualified-name="Consumida" id="ent0006" data-source-line="10"><rect x="282.25" y="630.181" width="207.494" height="61.906" fill="#E8F5E9" style="stroke:#2E7D32;stroke-width:0.5;" rx="4" ry="4"/><line x1="282.25" y1="654.15" x2="489.744" y2="654.15" style="stroke:#2E7D32;stroke-width:0.5;"/><text x="352.408" y="646.32" fill="#000" font-size="12" textLength="67.178" font-family="'DejaVu Sans'">Consumida</text><text x="287.25" y="670.288" fill="#000" font-size="12" textLength="187.494" font-family="'DejaVu Sans'">o lugar de requisição pendente</text><text x="287.25" y="684.257" fill="#000" font-size="12" textLength="152.18" font-family="'DejaVu Sans'">fica vazio para a próxima</text></g><g class="start_entity" data-qualified-name=".start." id="ent0007" data-source-line="12"><ellipse cx="437" cy="54.461" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0015" data-source-line="19"><ellipse cx="386" cy="778.091" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="386" cy="778.091" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="22"><path d="M525.12,646.171 L525.12,676.108 A4,4 0 0 0 529.12,680.108 L966.878,680.108 A4,4 0 0 0 970.878,676.108 L970.878,652.171 L960.878,642.171 L529.12,642.171 A4,4 0 0 0 525.12,646.171" style="stroke:#BDBDBD;stroke-width:0.5;" fill="#FFFDE7"/><path d="M960.878,642.171 L960.878,650.171 A2,2 0 0 0 962.878,652.171 L970.878,652.171 L960.878,642.171" style="stroke:#BDBDBD;stroke-width:1;" fill="#FFFDE7"/><text x="531.12" y="658.31" fill="#000" font-size="12" textLength="424.758" font-family="'DejaVu Sans'">Nos dois casos, o resultado (ou o relatório) é publicado no Blackboard,</text><text x="531.12" y="672.278" fill="#000" font-size="12" textLength="380.484" font-family="'DejaVu Sans'">e os observers (janela, CLI e registro de eventos) são avisados.</text></g><!--link *start* to Pendente--><g class="link" data-entity-1="ent0007" data-entity-2="ent0001" id="lnk8" data-source-line="12" data-link-type="dependency"><path d="M437,64.671 C437,82.891 437,119.281 437,148.041" style="stroke:#37474F;stroke-width:1;" fill="none" id="*start*-to-Pendente"/><polygon points="437,153.041,441,144.041,437,148.041,433,144.041,437,153.041" fill="#37474F" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="446.183" y="106.6" fill="#000" font-size="12" textLength="106.547" font-family="'DejaVu Sans'">a fachada publica</text><text x="438" y="120.568" fill="#000" font-size="12" textLength="122.912" font-family="'DejaVu Sans'">(publicarRequisicao)</text></g><!--link Pendente to Avaliacao--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk9" data-source-line="13" data-link-type="dependency"><path d="M437,215.691 C437,237.911 437,262.961 437,285.151" style="stroke:#37474F;stroke-width:1;" fill="none" id="Pendente-to-Avaliacao"/><polygon points="437,290.151,441,281.151,437,285.151,433,281.151,437,290.151" fill="#37474F" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="438" y="257.51" fill="#000" font-size="12" textLength="157.811" font-family="'DejaVu Sans'">o controlador inicia o ciclo</text></g><!--link Avaliacao to Aceita--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk10" data-source-line="14" data-link-type="dependency"><path d="M322.02,329.631 C244.73,337.221 152.64,352.401 128,382.281 C105.68,409.341 123.973,444.194 144.643,470.944" style="stroke:#37474F;stroke-width:1;" fill="none" id="Avaliacao-to-Aceita"/><polygon points="147.7,474.901,145.362,465.334,144.643,470.944,139.032,470.225,147.7,474.901" fill="#374